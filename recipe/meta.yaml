{% set name = "akgwas" %}
{% set version = "1.0.0" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  # NOTE: after tagging v1.0.0 on GitHub, replace the sha256 below with the real
  # value. Regenerate with:
  #   curl -sL <url> | sha256sum
  url: https://github.com/suzkami/AKmerGWAS/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 9f374e7201be394509db13e7081f963ce21db4675b153c40c74dbc3edcb07db8

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.11,<3.14
    - pip
    - setuptools
  run:
    - python >=3.11,<3.14
    - kmtricks
    - gemma
    - plink
    - bowtie
    - bwa

test:
  commands:
    - akgwas --version
    - akgwas --help
    - akgwas --errors
  imports:
    - akgwas
    - akgwas.stages

about:
  home: https://github.com/suzkami/AKmerGWAS
  license: MIT
  license_file: LICENSE
  summary: "AKmerGWAS -- k-mer GWAS for any input format (short reads, assemblies, genomes)."
  description: |
    AKmerGWAS is a k-mer based genome-wide association study pipeline that
    accepts any input format (short reads, assemblies, whole genomes). It counts
    k-mers with kmtricks, turns the presence/absence matrix into PLINK bed chunks,
    runs GEMMA association per chunk and trait, and maps significant k-mers back
    to reference genomes with bowtie or bwa. Version 1.0.0 is a pure-Python
    (standard-library-only) rewrite of the original Snakemake workflow.
  dev_url: https://github.com/suzkami/AKmerGWAS

extra:
  recipe-maintainers:
    - suzkami
