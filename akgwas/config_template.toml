# =============================================================================
# AKmerGWAS v1.0.0 configuration
#
# This is a TOML file. Values are plain; strings need quotes. Paths are resolved
# relative to `programhome` unless they are absolute, so the whole run can be
# launched from any working directory.
# =============================================================================

[common]
# Absolute path to the job home. Everything below is resolved relative to this.
programhome = "/path/to/kmer_home"
# Root for all outputs, relative to programhome (or absolute).
outdir = "."
# Sample/sequence list: one line per sample, `name : file1 ; file2 ; ...`.
fof_file = "fof.txt"
# Phenotype table: first column = sample ID, header row = trait names.
pheno_file = "pheno.txt"
# k-mer length. Keep 31 unless you have a reason to change it.
kmer_len = 31
# Minimum open-file limit; the preflight check raises `ulimit -n` if below.
ulimit_min = 4096

[paths]
# Output subdirectory names (relative to outdir). Change only if you must.
bed_dir = "bed"
qk_dir = "QK"
temp_dir = "temp_gemma"
final_dir = "kmergwas_outputs"
kmtricks_run_dir = "kmatrixs_out"

[build]
# Only k-mers seen at least `hard_min` times within a sample are recorded as present.
# Use 1 for assembled-genome / direct-genome input.
hard_min = 2
# Cross-sample recurrence minimum passed to kmtricks (`--recurrence-min`).
recurrence_min = 2
# Threads for kmtricks count/merge.
threads = 8
# kmtricks partition count; 0 lets kmtricks decide.
partitions = 0
# Stream the aggregate text matrix to stdout (recommended; avoids a huge file).
# Set to false to write a temporary text file instead (deleted afterwards).
aggregate_to_stdout = true

[multibed]
# Target/upper/lower chunk sizes, e.g. "500M", "1G", "10G". Chunks are cut by
# byte size, not by GNU parallel's 2GB block, so the chunk count is controlled.
block_size = "1G"
min_block_size = "16M"
max_block_size = "10G"
# Minor-allele-frequency filter: keep a k-mer iff its minor class frequency >= maf.
maf = 0.01
# Threads for the multibed stage (chunk conversion).
threads = 8
# "python": write .bed directly (no .tped ever hits disk; fastest, least disk).
# "plink" : write a temporary .tped per chunk and let plink convert (safest).
backend = "python"

[qk]
# Recommendation: supply K/PCA computed from SNP data (external) for real runs.
# The built-in k-mer version is a convenience fallback and is less reliable.
use_external = false
# Required when use_external = true:
kinship = "path/to/kinship.cXX.txt"
pca = "path/to/pca.txt"
# Fraction of bed chunks used to estimate the k-mer K/PCA (deterministic).
sample_fraction = 0.2
# Sampling seed -> reproducible chunk selection.
seed = 123456789
# gemma -gk: 1 = centered (default), 2 = standardized.
gk = 1
# Set true if your external PCA file carries sample IDs in its first column(s).
pca_has_id = false
# Threads for plink --pca (gemma -gk is single-threaded).
threads = 1

[kgwas]
# k-mers with p_wald <= threshold are extracted for downstream alignment.
threshold = 0.0001
# GEMMA is run single-threaded; concurrency comes from --cores at the CLI.
threads = 1

[alignment]
# List of reference indices, one per line.
#   aligner = "bowtie" -> lines are bowtie index *prefixes* (bowtie-build output)
#   aligner = "bwa"    -> lines are bwa index prefixes or *.sa paths
ref_list = "ref_list.txt"
# Default aligner. bowtie `-a -v 0` reports all full-length exact hits.
aligner = "bowtie"
# A k-mer with more than `max_hits` alignment positions is dropped entirely.
max_hits = 5000
# Threads per aligner invocation.
threads = 1
