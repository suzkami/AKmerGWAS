[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akgwas"
version = "1.0.0"
description = "AKmerGWAS -- k-mer GWAS pipeline for any input format (short reads, assemblies, genomes)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Su Zhuo", email = "szsuzhuo@163.com" }
]
keywords = ["gwas", "kmer", "kmtricks", "gemma", "plink", "bioinformatics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Pure standard library at runtime. External compute tools (kmtricks, gemma,
# plink, bwa, bowtie) are invoked as subprocesses and are declared in the
# conda recipe, not here.
dependencies = []

[project.urls]
Homepage = "https://github.com/suzkami/AKmerGWAS"
Repository = "https://github.com/suzkami/AKmerGWAS"

[project.scripts]
akgwas = "akgwas.cli:main"

[tool.setuptools]
packages = ["akgwas", "akgwas.stages"]
include-package-data = true
